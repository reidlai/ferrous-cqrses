# Pre-commit configuration for ferrous-cqrses
# Enforces Tier 1 DevSecOps shift-left standards (AD-13, NFR-10..12), Gitleaks, and Rust code quality.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=15000']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust Format Gate (cargo fmt)
        entry: cargo fmt -- --check
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: Rust Lint Gate (cargo clippy -D warnings)
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-test
        name: Rust Unit & Integration Test Gate (cargo test)
        entry: cargo test --all-targets
        language: system
        pass_filenames: false
        always_run: true
