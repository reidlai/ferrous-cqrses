[package]
name = "ferrous-cqrses"
version = "0.1.0"
edition = "2021"
authors = ["FerrousCX Contributors"]
description = "Dual-role CQRS and event sourcing core library and daemon service"
license = "MIT OR Apache-2.0"

[lib]
name = "ferrous_cqrses"
path = "src/lib.rs"

[[bin]]
name = "command_handler"
path = "src/bin/command_handler.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.10", features = ["v7", "v4", "serde", "std", "rng"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
bytes = "1.7"
futures = "0.3"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
